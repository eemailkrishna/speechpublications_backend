<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #1a1a2e; height: 100vh; display: flex; flex-direction: column; }
        .top { background: #16213e; color: white; padding: 12px 20px; display: flex; gap: 10px; align-items: center; }
        .top input { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 12px; }
        .top button { padding: 10px 20px; background: #7c2a2a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .top button:disabled { background: #555; }
        .main { flex: 1; display: flex; }
        .chat { flex: 1; display: flex; flex-direction: column; }
        .chat-header { background: #7c2a2a; color: white; padding: 12px 20px; font-weight: 600; }
        .msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; background: #e5ddd5; }
        .m { max-width: 65%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; }
        .m.out { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .m.in { align-self: flex-start; background: white; border-bottom-left-radius: 2px; }
        .m small { display: block; font-size: 10px; color: #999; margin-top: 4px; text-align: right; }
        .bar { padding: 12px; background: #f0f2f5; display: flex; gap: 10px; }
        .bar input { flex: 1; padding: 12px; border: none; border-radius: 24px; font-size: 14px; outline: none; }
        .bar button { width: 44px; height: 44px; border-radius: 50%; background: #7c2a2a; color: white; border: none; cursor: pointer; font-size: 18px; }
        .log { height: 150px; background: #0d1117; color: #58a6ff; font-family: monospace; font-size: 11px; overflow-y: auto; padding: 8px; }
        .log .ok { color: #3fb950; } .log .er { color: #f85149; }
    </style>
</head>
<body>
    <div class="top">
        <input type="text" id="token" placeholder="Paste JWT token">
        <input type="text" id="recvId" placeholder="Receiver User ID" style="max-width:120px">
        <button onclick="connect()" id="btn">Connect</button>
    </div>
    <div class="main">
        <div class="chat">
            <div class="chat-header" id="chatHead">Not connected</div>
            <div class="msgs" id="msgs"></div>
            <div class="bar">
                <input type="text" id="inp" placeholder="Type a message..." onkeypress="if(event.key==='Enter')send()">
                <button onclick="send()">➤</button>
            </div>
        </div>
    </div>
    <div class="log" id="log"></div>

<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<script>
const API = 'http://localhost/speech-publication/api';
const REVERB_KEY = 'EcuFjLB9tkrkOANRwTy8';

let pusher, channel, myId, myName, recvId, conversationId;

function log(t, c='') {
    const d = document.createElement('div');
    d.className = c;
    d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + t;
    var el = document.getElementById('log');
    el.appendChild(d);
    el.scrollTop = el.scrollHeight;
}

function showMsg(text, type) {
    var el = document.createElement('div');
    el.className = 'm ' + type;
    el.innerHTML = text + '<small>' + new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) + '</small>';
    document.getElementById('msgs').appendChild(el);
    document.getElementById('msgs').scrollTop = 99999;
}

async function connect() {
    var token = document.getElementById('token').value.trim();
    recvId = document.getElementById('recvId').value.trim();
    if (!token) return alert('Paste JWT token');
    if (!recvId) return alert('Enter Receiver User ID');

    document.getElementById('btn').disabled = true;
    document.getElementById('btn').textContent = 'Connecting...';

    try {
        var profileRes = await fetch(API + '/user/profile', {
            headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
        });
        var profile = await profileRes.json();
        if (!profile.success) { log('Auth failed', 'er'); return; }
        myId = profile.user.id;
        myName = profile.user.name;
        document.getElementById('chatHead').textContent = myName + ' -> User ' + recvId;
        log('Logged in: ' + myName + ' (ID: ' + myId + ')', 'ok');

        var convRes = await fetch(API + '/conversations', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ user_id: parseInt(recvId) })
        });
        var convData = await convRes.json();
        log('Conversation response: ' + JSON.stringify(convData).substring(0, 200), 'ok');

        conversationId = convData.id;
        if (!conversationId) {
            log('No conversation ID returned', 'er');
            return;
        }
        log('Conversation #' + conversationId, 'ok');
        setupPusher(token);
    } catch(e) {
        log('Error: ' + e.message, 'er');
        document.getElementById('btn').disabled = false;
        document.getElementById('btn').textContent = 'Connect';
    }
}

function setupPusher(token) {
    log('Setting up Pusher...', 'ok');
    pusher = new Pusher(REVERB_KEY, {
        wsHost: '127.0.0.1',
        wsPort: 8080,
        wssPort: 8080,
        forceTLS: false,
        disableStats: true,
        enabledTransports: ['ws'],
        authEndpoint: API.replace('/api', '') + '/broadcasting/auth',
        auth: {
            headers: { 'Authorization': 'Bearer ' + token }
        }
    });

    pusher.connection.bind('state_change', function(states) {
        log('Pusher state: ' + states.current, 'ok');
    });

    pusher.connection.bind('connected', function() {
        log('Pusher connected!', 'ok');
    });

    pusher.connection.bind('error', function(err) {
        log('Pusher error: ' + JSON.stringify(err), 'er');
    });

    channel = pusher.subscribe('private-conversation.' + conversationId);

    channel.bind('pusher:subscription_succeeded', function() {
        log('Subscribed to conversation!', 'ok');
        document.getElementById('btn').textContent = 'Connected';
        loadMessages();
    });

    channel.bind('pusher:subscription_error', function(err) {
        log('Subscription error: ' + JSON.stringify(err), 'er');
    });

    channel.bind('message.sent', function(data) {
        log('Received event: ' + JSON.stringify(data), 'ok');
        if (data.sender_id != myId) {
            showMsg(data.text, 'in');
            log('Message received: ' + data.text, 'ok');
        }
    });
}

function loadMessages() {
    var token = document.getElementById('token').value;
    fetch(API + '/conversations/' + conversationId + '/messages', {
        headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
    }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.data) {
            data.data.reverse().forEach(function(m) {
                showMsg(m.text, m.sender_id == myId ? 'out' : 'in');
            });
            log('Loaded ' + data.data.length + ' messages', 'ok');
        }
    });
}

function send() {
    var inp = document.getElementById('inp');
    var text = inp.value.trim();
    if (!text || !conversationId) return;

    fetch(API + '/messages', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + document.getElementById('token').value, 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ receiver_id: parseInt(recvId), text: text })
    }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.message === 'sent') {
            showMsg(text, 'out');
            inp.value = '';
            log('Sent: ' + text, 'ok');
        } else {
            log('Send failed: ' + JSON.stringify(data), 'er');
        }
    });
}
</script>
</body>
</html>
