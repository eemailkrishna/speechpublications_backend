<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #1a1a2e; height: 100vh; }
        .container { display: flex; height: calc(100vh - 160px); gap: 2px; }
        .phone { flex: 1; display: flex; flex-direction: column; background: #e5ddd5; }
        .phone-header { padding: 12px 16px; display: flex; gap: 10px; align-items: center; background: white; border-bottom: 1px solid #e0e0e0; }
        .phone-header input { flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 12px; }
        .phone-header button { padding: 10px 20px; background: #7c2a2a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
        .phone-header button:disabled { background: #ccc; }
        .chat-top { background: #7c2a2a; color: white; padding: 12px 16px; }
        .chat-top h4 { font-size: 15px; }
        .chat-top .conn { font-size: 11px; opacity: 0.8; }
        .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; background: #e5ddd5; background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23c8c4bc' fill-opacity='0.15'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E"); }
        .msg { max-width: 70%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.35; word-wrap: break-word; }
        .msg.sent { align-self: flex-end; background: #dcf8c6; border-bottom-right-radius: 2px; }
        .msg.recv { align-self: flex-start; background: white; border-bottom-left-radius: 2px; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .msg-time { font-size: 10px; color: #667781; text-align: right; margin-top: 2px; }
        .input-bar { padding: 10px 12px; background: #f0f2f5; display: flex; gap: 8px; align-items: center; }
        .input-bar input { flex: 1; padding: 10px 16px; border: none; border-radius: 24px; font-size: 14px; outline: none; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .input-bar button { width: 42px; height: 42px; border-radius: 50%; background: #7c2a2a; color: white; border: none; cursor: pointer; font-size: 18px; }
        .log { height: 160px; background: #0d1117; color: #58a6ff; font-family: 'Courier New', monospace; font-size: 11px; overflow-y: auto; padding: 10px; border-top: 2px solid #30363d; }
        .log .ok { color: #3fb950; } .log .err { color: #f85149; } .log .warn { color: #d29922; }
    </style>
</head>
<body>
<div class="container">
    <!-- User A -->
    <div class="phone">
        <div class="phone-header">
            <input type="text" id="tokenA" placeholder="User A JWT token">
            <button onclick="setup('A')" id="btnA">Connect A</button>
        </div>
        <div class="chat-top">
            <h4 id="nameA">User A</h4>
            <div class="conn" id="statusA">Not connected</div>
        </div>
        <div class="messages" id="msgsA"></div>
        <div class="input-bar">
            <input type="text" id="inputA" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg('A')">
            <button onclick="sendMsg('A')">➤</button>
        </div>
    </div>
    <!-- User B -->
    <div class="phone">
        <div class="phone-header">
            <input type="text" id="tokenB" placeholder="User B JWT token">
            <button onclick="setup('B')" id="btnB">Connect B</button>
        </div>
        <div class="chat-top">
            <h4 id="nameB">User B</h4>
            <div class="conn" id="statusB">Not connected</div>
        </div>
        <div class="messages" id="msgsB"></div>
        <div class="input-bar">
            <input type="text" id="inputB" placeholder="Type a message..." onkeypress="if(event.key==='Enter') sendMsg('B')">
            <button onclick="sendMsg('B')">➤</button>
        </div>
    </div>
</div>
<div class="log" id="logBox"></div>

<script src="https://js.pusher.com/8.2.0/pusher.min.js"></script>
<script>
const API = 'http://localhost/speech-publication';
const APP_KEY = 'EcuFjLB9tkrkOANRwTy8';
const state = {};

function log(msg, type = '') {
    const box = document.getElementById('logBox');
    const d = document.createElement('div');
    d.className = type;
    d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
}

function addMsg(phone, text, type) {
    const list = document.getElementById('msgs' + phone);
    const div = document.createElement('div');
    div.className = 'msg ' + (type === 'sent' ? 'sent' : 'recv');
    div.innerHTML = `${text}<div class="msg-time">${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
}

async function setup(phone) {
    const token = document.getElementById('token' + phone).value.trim();
    if (!token) { alert('Paste JWT token'); return; }

    document.getElementById('btn' + phone).disabled = true;
    document.getElementById('btn' + phone).textContent = 'Connecting...';

    try {
        // 1. Get profile
        const profileRes = await fetch(API + '/api/user/profile', {
            headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
        });
        const profile = await profileRes.json();
        if (!profile.success) { log('[' + phone + '] Auth failed', 'err'); return; }

        state[phone] = {
            token, userId: profile.user.id, name: profile.user.name,
            conversationId: null, otherUserId: null, pusher: null, channel: null
        };
        document.getElementById('name' + phone).textContent = state[phone].name;
        log('[' + phone + '] Logged in: ' + state[phone].name + ' (ID: ' + state[phone].userId + ')', 'ok');

        // 2. Load conversations
        const convRes = await fetch(API + '/api/messages/conversations?page=1&limit=20', {
            headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
        });
        const convData = await convRes.json();

        if (convData.success && convData.conversations.length > 0) {
            const conv = convData.conversations[0];
            state[phone].conversationId = conv.id;
            state[phone].otherUserId = conv.user?.id;
            log('[' + phone + '] Conversation #' + conv.id + ' with ' + conv.user?.name, 'ok');
        }

        // 3. Connect Pusher
        const pusher = new Pusher(APP_KEY, {
            wsHost: 'localhost', wsPort: 8080, wssPort: 8080,
            forceTLS: false, enabledTransports: ['ws'], cluster: 'mt1',
            authEndpoint: API + '/broadcasting/auth',
            auth: { headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' } }
        });
        state[phone].pusher = pusher;

        pusher.connection.bind('connected', () => {
            document.getElementById('status' + phone).textContent = '🟢 Online';
            document.getElementById('btn' + phone).textContent = 'Connected ✓';
            log('[' + phone + '] WebSocket connected', 'ok');
            if (state[phone].conversationId) subscribeToConversation(phone);
        });

        pusher.connection.bind('error', (e) => {
            log('[' + phone + '] WS Error: ' + JSON.stringify(e), 'err');
        });

        // 4. Load messages
        if (state[phone].conversationId) {
            const msgRes = await fetch(API + '/api/messages/conversations/' + state[phone].conversationId + '?page=1&limit=50', {
                headers: { 'Authorization': 'Bearer ' + token, 'Accept': 'application/json' }
            });
            const msgData = await msgRes.json();
            if (msgData.success) {
                const msgs = Array.isArray(msgData.messages) ? msgData.messages : Object.values(msgData.messages);
                msgs.forEach(m => {
                    addMsg(phone, m.content, m.sender_id == state[phone].userId ? 'sent' : 'recv');
                });
                log('[' + phone + '] Loaded ' + msgs.length + ' messages', 'ok');
            }
        } else {
            log('[' + phone + '] No existing conversation. Send a message to start one.', 'warn');
        }

    } catch (err) {
        log('[' + phone + '] Error: ' + (err.message || JSON.stringify(err)), 'err');
        document.getElementById('btn' + phone).disabled = false;
        document.getElementById('btn' + phone).textContent = 'Retry';
    }
}

function subscribeToConversation(phone) {
    const s = state[phone];
    if (!s || !s.conversationId) return;

    const channelName = 'private-conversation.' + s.conversationId;
    s.channel = s.pusher.subscribe(channelName);

    s.channel.bind('pusher:subscription_succeeded', () => {
        log('[' + phone + '] Subscribed to ' + channelName, 'ok');
    });

    s.channel.bind('pusher:subscription_error', (e) => {
        log('[' + phone + '] Sub error: ' + JSON.stringify(e), 'err');
    });

    s.channel.bind('message.sent', (data) => {
        const isMine = data.sender_id == s.userId;
        log('[' + phone + '] 📩 ' + (isMine ? 'me' : 'them') + ': ' + data.content, isMine ? 'ok' : 'warn');
        addMsg(phone, data.content, isMine ? 'sent' : 'recv');
    });
}

async function sendMsg(phone) {
    const s = state[phone];
    if (!s || !s.userId) { alert('Connect first!'); return; }

    const input = document.getElementById('input' + phone);
    const text = input.value.trim();
    if (!text) return;

    // Find other user
    let otherId = s.otherUserId;
    if (!otherId) {
        otherId = prompt('Enter receiver User ID:');
        if (!otherId) return;
        s.otherUserId = parseInt(otherId);
    }

    log('[' + phone + '] 📤 Sending to ' + s.otherUserId + ': ' + text, 'ok');

    try {
        const res = await fetch(API + '/api/messages/send', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + s.token,
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ receiver_id: s.otherUserId, content: text, type: 'text' })
        });
        const data = await res.json();

        if (data.success) {
            addMsg(phone, text, 'sent');
            input.value = '';
            log('[' + phone + '] ✅ Sent!', 'ok');

            if (!s.conversationId) {
                s.conversationId = data.message.conversation_id;
                log('[' + phone + '] New conversation #' + s.conversationId, 'ok');
                subscribeToConversation(phone);
            }
        } else {
            log('[' + phone + '] ❌ ' + (data.error?.message || 'Failed'), 'err');
        }
    } catch (err) {
        log('[' + phone + '] ❌ ' + (err.message || JSON.stringify(err)), 'err');
    }
}
</script>
</body>
</html>
